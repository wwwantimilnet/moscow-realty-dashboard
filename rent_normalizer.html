<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Нормализатор аренды</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Playfair+Display:wght@400;600&display=swap');

  :root {
    --bg: #faf8f4;
    --surface: #ffffff;
    --border: #e2ddd6;
    --text: #1a1814;
    --muted: #8a8480;
    --accent: #b8924a;
    --pos: #2d8a5e;
    --neg: #c0392b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'IBM Plex Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .container {
    width: 100%;
    max-width: 560px;
  }

  .header {
    margin-bottom: 40px;
  }

  .header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
  }

  .header p {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: 4px;
    padding: 48px 32px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--surface);
    position: relative;
  }

  .drop-zone:hover, .drop-zone.drag-over {
    border-color: var(--accent);
    background: #fdf9f3;
  }

  .drop-zone input {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }

  .drop-icon {
    font-size: 32px;
    margin-bottom: 12px;
    opacity: 0.4;
  }

  .drop-label {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.06em;
  }

  .drop-label strong {
    color: var(--accent);
    font-weight: 500;
  }

  .file-name {
    margin-top: 8px;
    font-size: 11px;
    color: var(--accent);
    min-height: 16px;
  }

  .status {
    margin-top: 24px;
    padding: 16px 20px;
    border-radius: 4px;
    font-size: 11px;
    letter-spacing: 0.04em;
    display: none;
  }

  .status.info {
    background: #f0f4ff;
    border: 1px solid #c8d4f0;
    color: #3a4a7a;
    display: block;
  }

  .status.success {
    background: #f0faf5;
    border: 1px solid #b8ddc8;
    color: #1e6040;
    display: block;
  }

  .status.error {
    background: #fdf0f0;
    border: 1px solid #f0c0c0;
    color: #8a2020;
    display: block;
  }

  .stats {
    margin-top: 6px;
    font-size: 10px;
    opacity: 0.7;
  }

  .btn {
    margin-top: 20px;
    width: 100%;
    padding: 14px;
    background: var(--text);
    color: var(--bg);
    border: none;
    border-radius: 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: background 0.2s;
    display: none;
  }

  .btn:hover { background: var(--accent); }
  .btn:disabled { background: var(--muted); cursor: not-allowed; }

  .btn.visible { display: block; }

  .footer {
    margin-top: 40px;
    font-size: 10px;
    color: var(--muted);
    text-align: center;
    letter-spacing: 0.05em;
  }

  .sheets-info {
    margin-top: 16px;
    display: none;
  }

  .sheets-info.visible { display: block; }

  .sheet-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
  }

  .sheet-row:last-child { border-bottom: none; }

  .sheet-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .sheet-dot.ok { background: var(--pos); }
  .sheet-dot.warn { background: #e0a020; }
  .sheet-dot.err { background: var(--neg); }

  .sheet-name { color: var(--muted); flex: 1; }
  .sheet-count { color: var(--text); font-weight: 500; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Нормализатор аренды</h1>
    <p>МОСКВА · ДАННЫЕ ПО ОКРУГАМ · RENT_OKRUG → NORM_OKRUG</p>
  </div>

  <div class="drop-zone" id="dropZone">
    <input type="file" id="fileInput" accept=".xlsx,.xls">
    <div class="drop-icon">📊</div>
    <div class="drop-label">
      Перетащи файл или <strong>нажми для выбора</strong>
    </div>
    <div class="drop-label" style="margin-top:6px; font-size:10px;">
      Ожидаем листы: Округ · Комнатность
    </div>
  </div>
  <div class="file-name" id="fileName"></div>

  <div class="sheets-info" id="sheetsInfo"></div>

  <div class="status" id="status"></div>

  <button class="btn" id="downloadBtn" onclick="downloadResult()">
    СКАЧАТЬ НОРМАЛИЗОВАННЫЙ ФАЙЛ
  </button>

  <div class="footer">
    Данные не покидают браузер · Обработка на стороне клиента
  </div>
</div>

<script>
const CAT_MAP = {
  0: 'studiya', 1: '1 komn', 2: '2 komn',
  3: '3 komn', 4: '4 komn', 5: 'mnogokomn'
};

let resultWorkbook = null;

// Drag & drop
const dropZone = document.getElementById('dropZone');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file) processFile(file);
});

document.getElementById('fileInput').addEventListener('change', e => {
  if (e.target.files[0]) processFile(e.target.files[0]);
});

function setStatus(msg, type, stats) {
  const el = document.getElementById('status');
  el.className = 'status ' + type;
  el.innerHTML = msg + (stats ? `<div class="stats">${stats}</div>` : '');
}

function fmtMonth(val) {
  if (!val) return '';
  // SheetJS даты приходят как число или строка
  if (typeof val === 'number') {
    const d = XLSX.SSF.parse_date_code(val);
    if (d) return `${d.y}-${String(d.m).padStart(2,'0')}`;
  }
  if (val instanceof Date) {
    return `${val.getFullYear()}-${String(val.getMonth()+1).padStart(2,'0')}`;
  }
  const s = String(val);
  // Уже в формате YYYY-MM
  if (/^\d{4}-\d{2}/.test(s)) return s.slice(0,7);
  return s;
}

function processFile(file) {
  document.getElementById('fileName').textContent = file.name;
  setStatus('Читаю файл...', 'info');
  resultWorkbook = null;
  document.getElementById('downloadBtn').classList.remove('visible');
  document.getElementById('sheetsInfo').classList.remove('visible');
  document.getElementById('sheetsInfo').innerHTML = '';

  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(e.target.result, { type: 'array', cellDates: true });
      const sheetNames = wb.SheetNames;

      // Ищем нужные листы по имени
      const okrugSheet = sheetNames.find(n => n === 'Округ');
      const komSheet   = sheetNames.find(n => n === 'Комнатность');

      const infoEl = document.getElementById('sheetsInfo');
      infoEl.innerHTML = '';

      // Показываем какие листы нашли
      const sheetStatus = [
        { name: 'Округ',        found: !!okrugSheet },
        { name: 'Комнатность',  found: !!komSheet },
      ];
      sheetStatus.forEach(s => {
        const row = document.createElement('div');
        row.className = 'sheet-row';
        row.innerHTML = `
          <div class="sheet-dot ${s.found ? 'ok' : 'err'}"></div>
          <div class="sheet-name">${s.name}</div>
          <div class="sheet-count">${s.found ? 'найден' : 'не найден'}</div>
        `;
        infoEl.appendChild(row);
      });
      infoEl.classList.add('visible');

      if (!okrugSheet) {
        setStatus('Лист «Округ» не найден в файле.', 'error',
          'Доступные листы: ' + sheetNames.join(', '));
        return;
      }

      // Читаем Округ
      const okrugRows = XLSX.utils.sheet_to_json(wb.Sheets[okrugSheet], { header: 1 });
      // headers: category, area, key, count, mean, median, average_price, month
      const normOkrug = [['month','area','category','count','mean','median','average_price']];
      let okrugCount = 0;

      for (let i = 1; i < okrugRows.length; i++) {
        const row = okrugRows[i];
        const cat   = row[0];
        const area  = row[1];
        const count = row[3];
        const mean  = row[4];
        const med   = row[5];
        const avg   = row[6];
        const month = fmtMonth(row[7]);

        if (cat === null || cat === undefined || !area || !month) continue;
        if (isNaN(Number(cat))) continue;
        if (!count && count !== 0) continue;

        normOkrug.push([
          month,
          area,
          CAT_MAP[Number(cat)] || String(cat),
          Math.round(Number(count)),
          Math.round(Number(mean)),
          Math.round(Number(med)),
          Math.round(Number(avg))
        ]);
        okrugCount++;
      }

      // Читаем Комнатность если есть
      const normKom = [['month','category','count','mean','median','average_price']];
      let komCount = 0;

      if (komSheet) {
        const komRows = XLSX.utils.sheet_to_json(wb.Sheets[komSheet], { header: 1 });
        // headers: category, count, mean, median, std, average_price, month
        for (let i = 1; i < komRows.length; i++) {
          const row = komRows[i];
          const cat   = row[0];
          const count = row[1];
          const mean  = row[2];
          const med   = row[3];
          const avg   = row[5];
          const month = fmtMonth(row[6]);

          if (!cat || !month) continue;
          if (isNaN(Number(count))) continue;

          normKom.push([
            month,
            String(cat),
            Math.round(Number(count)),
            Math.round(Number(mean)),
            Math.round(Number(med)),
            Math.round(Number(avg))
          ]);
          komCount++;
        }
      }

      // Обновляем инфо о листах с количеством строк
      infoEl.querySelectorAll('.sheet-count').forEach((el, i) => {
        if (i === 0) el.textContent = okrugCount + ' строк';
        if (i === 1) el.textContent = komCount ? komCount + ' строк' : 'не найден';
      });

      // Создаём выходной файл
      const wbOut = XLSX.utils.book_new();

      const wsOkrug = XLSX.utils.aoa_to_sheet(normOkrug);
      // Ширина колонок
      wsOkrug['!cols'] = [{wch:10},{wch:22},{wch:12},{wch:8},{wch:10},{wch:10},{wch:14}];
      XLSX.utils.book_append_sheet(wbOut, wsOkrug, 'NORM_Okrug');

      if (komCount > 0) {
        const wsKom = XLSX.utils.aoa_to_sheet(normKom);
        wsKom['!cols'] = [{wch:10},{wch:16},{wch:8},{wch:10},{wch:10},{wch:14}];
        XLSX.utils.book_append_sheet(wbOut, wsKom, 'NORM_Kom');
      }

      resultWorkbook = wbOut;

      setStatus(
        '✓ Файл обработан успешно',
        'success',
        `NORM_Okrug: ${okrugCount} строк` + (komCount ? ` · NORM_Kom: ${komCount} строк` : '')
      );
      document.getElementById('downloadBtn').classList.add('visible');

    } catch(err) {
      setStatus('Ошибка при обработке файла: ' + err.message, 'error');
      console.error(err);
    }
  };
  reader.readAsArrayBuffer(file);
}

function downloadResult() {
  if (!resultWorkbook) return;
  const btn = document.getElementById('downloadBtn');
  btn.disabled = true;
  btn.textContent = 'СОХРАНЕНИЕ...';
  setTimeout(() => {
    XLSX.writeFile(resultWorkbook, 'rent_normalized.xlsx');
    btn.disabled = false;
    btn.textContent = 'СКАЧАТЬ НОРМАЛИЗОВАННЫЙ ФАЙЛ';
  }, 100);
}
</script>
</body>
</html>
